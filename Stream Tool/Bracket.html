<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bracket</title>
    <link rel="stylesheet" href="Resources/CSS/Bracket.css">
    <script src="Resources/Scripts/Bracket.js" defer></script>
</head>
<body>

<!-- the encounters inside each round are built by Bracket.js, so only the
     round titles live here. rename them freely, the ids are what matter -->
<div id="content">

    <div class="row">
        <div class="round" id="WinnersSemis"><span class="roundTitle">Winners Semis</span></div>
        <div class="round" id="WinnersFinals"><span class="roundTitle">Winners Finals</span></div>
        <div class="round" id="GrandFinals"><span class="roundTitle">Grand Finals</span></div>
        <div class="round" id="TrueFinals"><span class="roundTitle">True Finals</span></div>
    </div>

    <div class="row">
        <div class="round" id="LosersTop8"><span class="roundTitle">Losers Top 8</span></div>
        <div class="round" id="LosersQuarters"><span class="roundTitle">Losers Quarters</span></div>
        <div class="round" id="LosersSemis"><span class="roundTitle">Losers Semis</span></div>
        <div class="round" id="LosersFinals"><span class="roundTitle">Losers Finals</span></div>
    </div>

</div>

</body>
</html>
